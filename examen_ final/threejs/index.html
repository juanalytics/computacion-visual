<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Final - Escena 3D con Three.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #1a1a1a;
            color: #ffffff;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            z-index: 100;
            max-width: 300px;
        }
        
        #controls h3 {
            margin-bottom: 15px;
            color: #4fc3f7;
            font-size: 16px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #4fc3f7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #29b6f6;
        }
        
        .info {
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="controls">
        <h3>🎥 Controles de Cámara</h3>
        <button id="toggle-camera">Cambiar Perspectiva</button>
        <div class="info">
            <strong>Perspectiva actual:</strong> <span id="camera-status">Frontal</span><br><br>
            <strong>Controles:</strong><br>
            • Click + arrastrar: Rotar cámara<br>
            • Rueda del mouse: Zoom<br>
            • Click derecho + arrastrar: Pan
        </div>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
