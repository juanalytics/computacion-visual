<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1: Materiales PBR y Luz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #1a1a1a;
            color: #ffffff;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            max-width: 350px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 100;
        }
        
        .control-group {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-group:last-child {
            border-bottom: none;
        }
        
        .control-group h3 {
            margin-bottom: 10px;
            color: #4fc3f7;
            font-size: 14px;
            text-transform: uppercase;
        }
        
        label {
            display: block;
            margin-top: 8px;
            font-size: 12px;
            color: #b0b0b0;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }
        
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
        }
        
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #4fc3f7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #29b6f6;
        }
        
        .info {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }
        
        #color-info {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            font-size: 11px;
            line-height: 1.6;
        }
        
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="controls">
        <div class="control-group">
            <h3>🎥 Cámara</h3>
            <label>Proyección:</label>
            <select id="camera-type">
                <option value="perspective">Perspectiva</option>
                <option value="orthographic">Ortográfica</option>
            </select>
            <button id="toggle-camera">Alternar Cámara</button>
        </div>
        
        <div class="control-group">
            <h3>🎨 Material PBR</h3>
            <label>Albedo (Color Base):</label>
            <input type="color" id="albedo-color" value="#808080">
            
            <label>Roughness (Rugosidad): <span id="roughness-value">0.5</span></label>
            <input type="range" id="roughness" min="0" max="1" step="0.01" value="0.5">
            
            <label>Metalness (Metalicidad): <span id="metalness-value">0.5</span></label>
            <input type="range" id="metalness" min="0" max="1" step="0.01" value="0.5">
            
            <label>Normal Map Intensity: <span id="normal-value">1.0</span></label>
            <input type="range" id="normal-intensity" min="0" max="2" step="0.1" value="1.0">
        </div>
        
        <div class="control-group">
            <h3>💡 Iluminación</h3>
            <label>Key Light Intensity: <span id="key-intensity-value">1.0</span></label>
            <input type="range" id="key-intensity" min="0" max="3" step="0.1" value="1.0">
            
            <label>Fill Light Intensity: <span id="fill-intensity-value">0.5</span></label>
            <input type="range" id="fill-intensity" min="0" max="3" step="0.1" value="0.5">
            
            <label>Rim Light Intensity: <span id="rim-intensity-value">0.8</span></label>
            <input type="range" id="rim-intensity" min="0" max="3" step="0.1" value="0.8">
            
            <label>HDRI Environment: <span id="hdri-value">1.0</span></label>
            <input type="range" id="hdri-intensity" min="0" max="2" step="0.1" value="1.0">
        </div>
        
        <div class="control-group">
            <h3>🌈 Paleta de Colores</h3>
            <label>Color Principal:</label>
            <input type="color" id="palette-color" value="#4fc3f7">
            <div id="color-info">
                <div><strong>RGB:</strong> <span id="rgb-values">-</span></div>
                <div><strong>HSV:</strong> <span id="hsv-values">-</span></div>
                <div><strong>CIELAB:</strong> <span id="lab-values">-</span></div>
                <div><strong>Contraste:</strong> <span id="contrast-value">-</span></div>
            </div>
        </div>
        
        <div class="control-group">
            <h3>🎬 Animaciones</h3>
            <button id="toggle-animation">Iniciar Animación</button>
            <button id="reset-material">Reset Material</button>
        </div>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
